name: live-check
# After GitHub Pages deploys, fetch the live site and compare it with this repository.
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Live check
        run: python .github/scripts/live_check.py --base-url "${SITE_URL:-https://agentic-spartans.github.io}"
